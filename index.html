<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Feedly</title>
    <style>
      /* Critical inline CSS: paint the eye-care green background on the very
       * first frame so the window never shows a white flash before the app
       * bundle loads. Colours mirror --color-canvas in src/index.css. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #c7edcc;
      }
      html.dark,
      html.dark body {
        background: #16241c;
      }
      #root {
        min-height: 100%;
      }
    </style>
    <script>
      // Apply theme class before first paint to avoid a background flash.
      // The authoritative theme (light/dark/system) is re-applied from settings
      // once they load; this only seeds the common system-preference case.
      try {
        var t = localStorage.getItem('feedly-theme') || 'system';
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
